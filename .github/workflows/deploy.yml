name: Deploy to GitHub Pages

# 触发：推送到 main 分支，或在 Actions 页面手动点一次
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GitHub Pages 部署在 https://<用户名>.github.io/<仓库名>/ 子路径下，所以 build 时带上 base
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: 生成 404.html（让子页深链接刷新不 404）
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          # 首次运行时自动开启 Pages，免去手动去 Settings 里点
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4